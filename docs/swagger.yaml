definitions:
  models.GenerateRequest:
    properties:
      features:
        items:
          type: string
        type: array
      projectName:
        example: my-awesome-app
        type: string
    type: object
  models.LoginInput:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: password123
        type: string
    type: object
  models.RegisterInput:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: password123
        type: string
    type: object
  models.ResendOTPInput:
    properties:
      email:
        example: user@example.com
        type: string
    type: object
  models.UserProfileResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      is_verified:
        type: boolean
      updated_at:
        type: string
    type: object
  models.VerifyOTPInput:
    properties:
      email:
        example: user@example.com
        type: string
      otp:
        example: "123456"
        type: string
    type: object
info:
  contact: {}
  description: Backend generator microservice
  title: GoCraft API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Accepts credentials and returns a JWT token
      parameters:
      - description: User Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.LoginInput'
      produces:
      - application/json
      responses: {}
      summary: Authenticate user and return JWT
      tags:
      - Auth
  /auth/me:
    get:
      consumes:
      - application/json
      description: Returns user ID and email from JWT
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Get current authenticated user
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Accepts credentials, creates user, and sends OTP verification email
      parameters:
      - description: User Registration Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.RegisterInput'
      produces:
      - application/json
      responses: {}
      summary: Register user and send OTP verification
      tags:
      - Auth
  /auth/resend-otp:
    post:
      consumes:
      - application/json
      description: Resend the OTP code for verification
      parameters:
      - description: Resend OTP Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ResendOTPInput'
      produces:
      - application/json
      responses: {}
      summary: Resend OTP code
      tags:
      - Auth
  /auth/verify-otp:
    post:
      consumes:
      - application/json
      description: Verify the OTP code sent during registration
      parameters:
      - description: OTP Verification Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.VerifyOTPInput'
      produces:
      - application/json
      responses: {}
      summary: Verify OTP code
      tags:
      - Auth
  /generate:
    post:
      consumes:
      - application/json
      description: Accepts selected features and returns a downloadable zip file
      parameters:
      - description: Selected Features
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/models.GenerateRequest'
      produces:
      - application/zip
      responses: {}
      security:
      - BearerAuth: []
      summary: Generate Go backend project
      tags:
      - Generator
  /user/profile:
    get:
      consumes:
      - application/json
      description: Returns the profile information for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserProfileResponse'
        "401":
          description: User not authenticated
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - User
security:
- BearerAuth: []
securityDefinitions:
  BearerAuth:
    description: 'Enter your JWT token in the format: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
