definitions:
  handlers.DatabaseMaintenanceConfigRequest:
    properties:
      archival_threshold_days:
        maximum: 365
        minimum: 1
        type: integer
      cleanup_batch_size:
        maximum: 10000
        minimum: 100
        type: integer
      maintenance_interval_hours:
        maximum: 168
        minimum: 1
        type: integer
    type: object
  handlers.FileCleanupConfigRequest:
    properties:
      batch_size:
        maximum: 1000
        minimum: 10
        type: integer
      cleanup_interval_hours:
        maximum: 168
        minimum: 1
        type: integer
      max_concurrency:
        maximum: 20
        minimum: 1
        type: integer
      retention_period_days:
        maximum: 365
        minimum: 1
        type: integer
    type: object
  handlers.MaintenanceConfigRequest:
    properties:
      database_maintenance:
        $ref: '#/definitions/handlers.DatabaseMaintenanceConfigRequest'
      file_cleanup:
        $ref: '#/definitions/handlers.FileCleanupConfigRequest'
    type: object
  handlers.UpdateUserRoleRequest:
    properties:
      role:
        enum:
        - user
        - admin
        type: string
    required:
    - role
    type: object
  models.DailyActivityCount:
    properties:
      count:
        type: integer
      date:
        type: string
    type: object
  models.DuplicateProjectRequest:
    properties:
      new_project_name:
        maxLength: 50
        minLength: 1
        type: string
      original_project_id:
        minimum: 1
        type: integer
    required:
    - new_project_name
    - original_project_id
    type: object
  models.GenerateRequest:
    properties:
      features:
        items:
          type: string
        minItems: 1
        type: array
      framework:
        example: gin
        type: string
      projectName:
        example: my-awesome-app
        maxLength: 50
        minLength: 1
        type: string
    required:
    - features
    - projectName
    type: object
  models.LoginInput:
    properties:
      email:
        example: user@example.com
        maxLength: 255
        type: string
      password:
        example: password123
        maxLength: 128
        minLength: 1
        type: string
    required:
    - email
    - password
    type: object
  models.ProjectHistoryListResponse:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      projects:
        items:
          $ref: '#/definitions/models.ProjectHistoryResponse'
        type: array
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  models.ProjectHistoryResponse:
    properties:
      adjusted_features:
        items:
          type: string
        type: array
      can_download:
        type: boolean
      can_regenerate:
        type: boolean
      created_at:
        type: string
      features:
        items:
          type: string
        type: array
      framework:
        type: string
      generation_duration_ms:
        type: integer
      id:
        type: integer
      project_name:
        type: string
      zip_file_size:
        type: integer
      zip_file_status:
        type: string
    type: object
  models.ProjectStatsResponse:
    properties:
      framework_distribution:
        additionalProperties:
          type: integer
        type: object
      most_used_features:
        items:
          type: string
        type: array
      most_used_framework:
        type: string
      recent_activity:
        items:
          $ref: '#/definitions/models.DailyActivityCount'
        type: array
      total_projects:
        type: integer
    type: object
  models.RegisterInput:
    properties:
      email:
        example: user@example.com
        maxLength: 255
        type: string
      password:
        example: password123
        maxLength: 128
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  models.ResendOTPInput:
    properties:
      email:
        example: user@example.com
        maxLength: 255
        type: string
    required:
    - email
    type: object
  models.VerifyOTPInput:
    properties:
      email:
        example: user@example.com
        maxLength: 255
        type: string
      otp:
        example: "123456"
        type: string
    required:
    - email
    - otp
    type: object
  services.CleanupStats:
    properties:
      bytes_freed:
        type: integer
      database_updates:
        type: integer
      duration:
        description: Duration as string for JSON serialization
        type: string
      end_time:
        type: string
      errors:
        type: integer
      files_deleted:
        type: integer
      files_processed:
        type: integer
      files_skipped:
        type: integer
      start_time:
        type: string
    type: object
  services.DatabaseHealthReport:
    properties:
      active_records:
        type: integer
      average_query_time_ms:
        type: number
      connection_status:
        type: string
      expired_records:
        type: integer
      fragmentation_level:
        type: number
      index_efficiency:
        type: number
      orphaned_records:
        type: integer
      recommended_actions:
        items:
          type: string
        type: array
      slow_queries:
        type: integer
      table_size_mb:
        type: integer
      timestamp:
        type: string
      total_records:
        type: integer
    type: object
  services.IntegrityReport:
    properties:
      duration:
        description: Duration as string for JSON serialization
        type: string
      end_time:
        type: string
      fixed_records:
        type: integer
      invalid_paths:
        type: integer
      missing_files:
        type: integer
      start_time:
        type: string
      status_mismatches:
        type: integer
      total_records:
        type: integer
      valid_files:
        type: integer
    type: object
  services.MaintenanceStats:
    properties:
      duration:
        description: Duration as string for JSON serialization
        type: string
      end_time:
        type: string
      errors:
        type: integer
      indexes_optimized:
        type: integer
      orphaned_records:
        type: integer
      records_archived:
        type: integer
      records_deleted:
        type: integer
      records_processed:
        type: integer
      start_time:
        type: string
      vacuum_operations:
        type: integer
    type: object
  services.PerformanceMetrics:
    properties:
      cache_hit_ratio:
        type: number
      connection_pool_usage:
        type: number
      index_scans:
        type: integer
      index_usage:
        additionalProperties:
          type: integer
        type: object
      query_execution_time:
        additionalProperties:
          type: number
        type: object
      table_scans:
        type: integer
    type: object
  services.StorageStats:
    properties:
      available_files:
        type: integer
      deleted_files:
        type: integer
      expired_files:
        type: integer
      total_files:
        type: integer
      total_size:
        type: integer
    type: object
info:
  contact: {}
  description: Backend generator microservice
  title: GoCraft API
  version: "1.0"
paths:
  /api/admin/stats:
    get:
      consumes:
      - application/json
      description: Retrieves comprehensive statistics about users and system usage
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get user statistics (Admin only)
      tags:
      - Admin
  /api/admin/users:
    get:
      consumes:
      - application/json
      description: Retrieves a list of all users with their roles and basic information
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 20, max: 100)'
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get all users (Admin only)
      tags:
      - Admin
  /api/admin/users/{id}/role:
    put:
      consumes:
      - application/json
      description: Updates a user's role between 'user' and 'admin'
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Role update request
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateUserRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update user role (Admin only)
      tags:
      - Admin
  /api/history:
    get:
      consumes:
      - application/json
      description: Retrieves paginated list of user's generated projects with filtering
        and search capabilities
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 10, max: 100)'
        in: query
        name: page_size
        type: integer
      - description: Search in project name, framework, or features
        in: query
        name: search
        type: string
      - description: Filter by framework (gin, echo, fiber)
        in: query
        name: framework
        type: string
      - description: Filter by multiple frameworks (comma-separated)
        in: query
        name: frameworks
        type: string
      - description: Filter by features (comma-separated)
        in: query
        name: features
        type: string
      - description: Filter by ZIP file status (available, expired, deleted, error)
        in: query
        name: status
        type: string
      - description: Filter from date (YYYY-MM-DD format)
        in: query
        name: date_from
        type: string
      - description: Filter to date (YYYY-MM-DD format)
        in: query
        name: date_to
        type: string
      - description: Sort field (created_at, project_name, framework, zip_file_size,
          generation_duration_ms)
        in: query
        name: sort_by
        type: string
      - description: 'Sort order (asc, desc, default: desc)'
        in: query
        name: sort_order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ProjectHistoryListResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get user's project history
      tags:
      - History
  /api/history/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes a project from user's history with ownership validation
        and file cleanup
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete project from history
      tags:
      - History
    get:
      consumes:
      - application/json
      description: Retrieves detailed information about a specific project with ownership
        validation
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ProjectHistoryResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get specific project details
      tags:
      - History
  /api/history/{id}/download:
    get:
      consumes:
      - application/json
      description: Downloads the ZIP file for a specific project with ownership validation
        and security checks
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/zip
      responses:
        "200":
          description: Project ZIP file
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "410":
          description: Gone
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Download project ZIP file
      tags:
      - History
  /api/history/{id}/regenerate:
    post:
      consumes:
      - application/json
      description: Regenerates a project using the same configuration as a previous
        project with ownership validation
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/zip
      responses:
        "200":
          description: Regenerated project ZIP file
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Regenerate project with same configuration
      tags:
      - History
  /api/history/cache-info:
    get:
      consumes:
      - application/json
      description: Retrieves information about the statistics cache performance and
        status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get cache performance information
      tags:
      - History
  /api/history/dashboard:
    get:
      consumes:
      - application/json
      description: Retrieves comprehensive dashboard data with caching and performance
        optimizations for large datasets
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get optimized dashboard data
      tags:
      - History
  /api/history/duplicate:
    post:
      consumes:
      - application/json
      description: Creates a duplicate configuration from an existing project for
        pre-populating the generator form
      parameters:
      - description: Duplicate Project Request
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/models.DuplicateProjectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Duplicate project configuration
      tags:
      - History
  /api/history/stats:
    get:
      consumes:
      - application/json
      description: Retrieves comprehensive statistics about user's project generation
        patterns including framework usage, most used features, and recent activity
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ProjectStatsResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get user's project statistics
      tags:
      - History
  /api/maintenance/config:
    put:
      consumes:
      - application/json
      description: Updates the configuration for maintenance services
      parameters:
      - description: Maintenance configuration
        in: body
        name: config
        required: true
        schema:
          $ref: '#/definitions/handlers.MaintenanceConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update maintenance configuration
      tags:
      - maintenance
  /api/maintenance/database/run:
    post:
      consumes:
      - application/json
      description: Manually trigger database maintenance operations
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.MaintenanceStats'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Run database maintenance
      tags:
      - maintenance
  /api/maintenance/files/run:
    post:
      consumes:
      - application/json
      description: Manually trigger file cleanup operations
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.CleanupStats'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Run file cleanup
      tags:
      - maintenance
  /api/maintenance/health:
    get:
      consumes:
      - application/json
      description: Returns comprehensive database health metrics and recommendations
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.DatabaseHealthReport'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get database health status
      tags:
      - maintenance
  /api/maintenance/integrity:
    post:
      consumes:
      - application/json
      description: Checks if files referenced in database actually exist
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.IntegrityReport'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Validate file integrity
      tags:
      - maintenance
  /api/maintenance/performance:
    get:
      consumes:
      - application/json
      description: Returns detailed database performance metrics
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.PerformanceMetrics'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get database performance metrics
      tags:
      - maintenance
  /api/maintenance/start:
    post:
      consumes:
      - application/json
      description: Starts the automatic maintenance services
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Start maintenance services
      tags:
      - maintenance
  /api/maintenance/status:
    get:
      consumes:
      - application/json
      description: Returns the status of maintenance services
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get maintenance service status
      tags:
      - maintenance
  /api/maintenance/stop:
    post:
      consumes:
      - application/json
      description: Stops the automatic maintenance services
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Stop maintenance services
      tags:
      - maintenance
  /api/maintenance/storage:
    get:
      consumes:
      - application/json
      description: Returns file storage usage statistics
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.StorageStats'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
