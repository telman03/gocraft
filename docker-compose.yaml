version: "3.9"

services:
  db:
    image: postgres:15
    container_name: gocraft-db
    restart: always
    environment:
      POSTGRES_USER: gocraft
      POSTGRES_PASSWORD: eden258
      POSTGRES_DB: gocraft_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: