name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: 1.23.12

    - name: Run tests
      run: go test -v ./...

    - name: Build for multiple platforms
      run: |
        # Linux
        GOOS=linux GOARCH=amd64 go build -o gocraft-linux-amd64 ./cmd/gocraft
        GOOS=linux GOARCH=arm64 go build -o gocraft-linux-arm64 ./cmd/gocraft
        
        # macOS
        GOOS=darwin GOARCH=amd64 go build -o gocraft-darwin-amd64 ./cmd/gocraft
        GOOS=darwin GOARCH=arm64 go build -o gocraft-darwin-arm64 ./cmd/gocraft
        
        # Windows
        GOOS=windows GOARCH=amd64 go build -o gocraft-windows-amd64.exe ./cmd/gocraft

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          gocraft-linux-amd64
          gocraft-linux-arm64
          gocraft-darwin-amd64
          gocraft-darwin-arm64
          gocraft-windows-amd64.exe
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}